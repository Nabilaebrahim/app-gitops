name: "Manual App Deploy"
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        id: build-image
        run: |
          
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          REPOSITORY=gitops-webapp
          IMAGE_TAG=latest
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Kubeconfig
        run: |
         
          aws eks update-kubeconfig --name githubactions-eks --region ${{ vars.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          
          sed -i "s|ECR_IMAGE_URL_PLACEHOLDER|${{ steps.build-image.outputs.image }}|g" k8s/app-config.yaml
          kubectl apply -f k8s/app-config.yaml